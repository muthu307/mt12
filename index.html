<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
        h1, h2, h3 {
            background-color: #3f51b5; /* Background color for headings */
            color: white; /* Text color for headings */
            padding: 10px; /* Padding around headings */
            border-radius: 5px; /* Rounded corners */
            margin-bottom: 20px; /* Space below headings */
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 20px auto; /* Center the list with margin */
            max-width: 400px; /* Max width for the list */
        }
        li {
            background-color: #e3f2fd; /* Background color for each link box */
            border: 1px solid #bbdefb; /* Border around each box */
            border-radius: 5px; /* Rounded corners */
            margin: 10px 0; /* Space between each link box */
            padding: 15px; /* Padding inside each box */
        }
        a {
            text-decoration: none;
            color: #007BFF; /* Link color */
            font-weight: bold; /* Bold links */
        }
        a:hover {
            text-decoration: underline; /* Underline on hover */
        }
    </style>
